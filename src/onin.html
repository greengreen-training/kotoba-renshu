<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2e8b57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="グリーン・グリーン">
<title>ことばのリハビリデイサービス グリーン・グリーン｜音韻選択課題</title>
<style>
  :root{
    --green:#2e8b57; --green-dark:#1f6e42; --green-light:#e8f5ec;
    --cream:#fffdf5; --ink:#333333; --orange:#e67e22; --red:#c0392b;
    --blue:#2f6fb3; --grey:#c8c8c8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  html,body{ height:100%; }
  body{
    font-family:"BIZ UDGothic","UD デジタル 教科書体 N-R","Hiragino Maru Gothic ProN","メイリオ",Meiryo,sans-serif;
    background:var(--cream); color:var(--ink);
    display:flex; justify-content:center;
    font-size:20px; line-height:1.5;
  }
  #app{ width:100%; max-width:760px; min-height:100%; padding:16px; padding-left:calc(16px + env(safe-area-inset-left)); padding-right:calc(16px + env(safe-area-inset-right)); padding-bottom:calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; }
  .screen{ display:none; flex:1; flex-direction:column; }
  .screen.active{ display:flex; }
  button{ font-family:inherit; cursor:pointer; border:none; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  button:focus-visible{ outline:4px solid var(--blue); outline-offset:2px; }

  /* ===== タイトル画面 ===== */
  #title-screen{ justify-content:center; align-items:center; text-align:center; gap:12px; }
  .title-row{ display:flex; align-items:center; justify-content:center; gap:10px; }
  .title-row .logo{ width:62px; height:62px; flex-shrink:0; mix-blend-mode:multiply; }
  @media (max-width:560px){ .title-row .logo{ width:46px; height:46px; } }
  .title-small{ font-size:22px; color:var(--green-dark); font-weight:bold; letter-spacing:2px; }
  .title-big{
    font-size:42px; font-weight:bold; color:var(--green);
    letter-spacing:2px; line-height:1.3;
    text-shadow:2px 2px 0 #d5ecdc;
  }
  .title-sub{ font-size:26px; color:var(--ink); background:var(--green-light);
    border-radius:14px; padding:6px 24px; }
  .section-label{ font-size:21px; color:#555; font-weight:bold; margin-top:8px; }
  .mode-btns{ display:flex; gap:12px; width:100%; max-width:520px; }
  .mode-btn{
    flex:1; background:#fff; border:4px solid #bbb; border-radius:18px;
    padding:12px 6px; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:#666;
  }
  .mode-btn .m-name{ font-size:23px; font-weight:bold; }
  .mode-btn.selected{
    border-color:var(--green); background:var(--green-light); color:var(--green-dark);
    box-shadow:0 0 0 3px #bfe3cc inset;
  }
  .mode-btn.selected .m-name::before{ content:"✓ "; color:var(--green); }
  .level-btns{ display:flex; flex-direction:column; gap:14px; width:100%; max-width:430px; }
  .level-btn{
    font-size:33px; font-weight:bold; color:#fff;
    border-radius:20px; padding:16px 10px; min-height:80px;
    display:flex; justify-content:center; align-items:center; gap:14px;
    box-shadow:0 5px 0 rgba(0,0,0,.22);
    transition:transform .08s;
  }
  .level-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.22); }
  .level-btn .stars{ font-size:25px; }
  #btn-easy{ background:var(--green); }
  #btn-normal{ background:var(--orange); }
  #btn-hard{ background:var(--blue); }

  /* ===== 課題画面 ===== */
  .quiz-header{ display:flex; align-items:center; gap:14px; margin-bottom:8px; }
  #quit-btn{
    font-size:20px; font-weight:bold; color:#666; background:#efefef;
    border:2px solid #bbb; border-radius:12px; padding:8px 16px; white-space:nowrap;
  }
  #progress-num{ font-size:24px; font-weight:bold; color:var(--green-dark); white-space:nowrap; }
  #progress-bar{ flex:1; height:18px; background:#e4e4de; border-radius:9px; overflow:hidden; }
  #progress-fill{ height:100%; width:0%; background:var(--green); border-radius:9px; transition:width .3s; }

  .card{
    background:#fff; border:3px solid #d8e8dd; border-radius:22px;
    padding:14px 10px 10px; text-align:center; position:relative;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
  }
  .stimulus{ display:flex; justify-content:center; align-items:center; gap:24px; flex-wrap:wrap; }
  .illust{ width:165px; height:165px; display:flex; justify-content:center; align-items:center; }
  .illust .emoji{ font-size:115px; line-height:1; }
  .illust svg,.illust img{ width:155px; height:155px; border-radius:16px; }
  .kanji{ font-size:88px; font-weight:bold; line-height:1.1; }
  .kanji.long{ font-size:60px; }

  .mora-row{ display:flex; justify-content:center; gap:12px; margin:16px 0 6px; }
  .mora-row.many{ gap:7px; }
  .mora-row.many .mora{ width:64px; height:64px; font-size:38px; }
  .mora-row.many .mora.blank{ font-size:32px; }
  .mora-row.many .mora.blank.filled,
  .mora-row.many .mora.blank.reveal{ font-size:38px; }
  .mora{
    width:82px; height:82px; border-radius:14px;
    display:flex; justify-content:center; align-items:center;
    font-size:50px; font-weight:bold;
    background:var(--green-light); border:3px solid #bcd9c6;
  }
  .mora.blank{
    background:#fafaf4; border:4px dashed #c9c9bd; color:#c9c9bd; font-size:42px;
  }
  .mora.blank.current{
    background:#fff8e6; border-color:var(--orange); color:var(--orange);
    animation:pulse 1.2s infinite;
  }
  @keyframes pulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.07);} }
  .mora.blank.filled{
    background:#e6f7ea; border:4px solid var(--green); color:var(--green-dark);
    font-size:50px; animation:pop .35s;
  }
  .mora.blank.reveal{
    background:#eef3fb; border:4px solid var(--blue); color:var(--blue);
    font-size:50px; animation:pop .35s;
  }
  @keyframes pop{ 0%{transform:scale(.4);} 70%{transform:scale(1.15);} 100%{transform:scale(1);} }

  .choices{
    display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:18px;
  }
  .choice{
    font-size:50px; font-weight:bold; color:var(--ink);
    background:#fff; border:4px solid #999; border-radius:18px;
    min-height:92px; box-shadow:0 4px 0 rgba(0,0,0,.15);
    transition:transform .07s;
  }
  .choice:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.15); }
  .choice.wrong{ background:#fdecea; color:var(--red); border-color:var(--red); box-shadow:none; cursor:default; }
  .choice.used{ background:#eeeeee; color:#bbb; border-color:#ccc; box-shadow:none; cursor:default; }
  .choice.right{ background:var(--green); color:#fff; border-color:var(--green-dark); }
  .choice:disabled{ cursor:default; }

  #judge{
    position:absolute; inset:0; display:none; justify-content:center; align-items:center;
    pointer-events:none; z-index:5;
  }
  #judge.show{ display:flex; }
  #judge span{ font-size:180px; font-weight:bold; animation:pop .4s; }
  #judge .maru{ color:rgba(226,60,60,.85); }
  #judge .batu{ color:rgba(70,90,200,.75); }
  #judge .sankaku{ color:rgba(230,126,34,.9); }

  /* ===== 結果画面 ===== */
  #result-screen{ justify-content:center; align-items:center; text-align:center; gap:18px; }
  #result-stamp{ font-size:105px; }
  #result-msg{ font-size:38px; font-weight:bold; color:var(--green-dark); }
  #result-score{ font-size:32px; background:#fff; border:3px solid #d8e8dd;
    border-radius:18px; padding:14px 34px; }
  #result-score b{ font-size:54px; color:var(--red); }
  .result-btns{ display:flex; flex-direction:column; gap:14px; width:100%; max-width:400px; margin-top:8px; }
  .result-btn{
    font-size:29px; font-weight:bold; border-radius:18px; padding:17px; color:#fff;
    box-shadow:0 5px 0 rgba(0,0,0,.22);
  }
  .result-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.22); }
  #retry-btn{ background:var(--green); }
  #home-btn{ background:#8a8a8a; }

  footer{ text-align:center; color:#9bb3a2; font-size:14px; padding-top:10px; }

  @media (max-width:560px){
    .kanji{ font-size:60px; } .kanji.long{ font-size:42px; }
    .illust{ width:125px; height:125px; } .illust .emoji{ font-size:90px; }
    .illust svg,.illust img{ width:120px; height:120px; }
    .mora{ width:60px; height:60px; font-size:38px; }
    .mora.blank{ font-size:32px; }
    .mora.blank.filled{ font-size:38px; }
    .mora.blank.reveal{ font-size:38px; }
    .mora-row{ gap:8px; }
    .mora-row.many{ gap:5px; }
    .mora-row.many .mora{ width:48px; height:48px; font-size:28px; }
    .mora-row.many .mora.blank{ font-size:24px; }
    .mora-row.many .mora.blank.filled,
    .mora-row.many .mora.blank.reveal{ font-size:28px; }
    .choice{ font-size:40px; min-height:78px; }
    .title-big{ font-size:31px; }
    .mode-btn .m-name{ font-size:19px; }
  }
  @media (max-width:380px){
    #app{ padding:10px; }
    .kanji{ font-size:52px; } .kanji.long{ font-size:36px; }
    .illust{ width:105px; height:105px; } .illust .emoji{ font-size:76px; }
    .illust svg,.illust img{ width:100px; height:100px; }
    .mora{ width:52px; height:52px; font-size:32px; }
    .mora.blank{ font-size:27px; }
    .mora.blank.filled,.mora.blank.reveal{ font-size:32px; }
    .mora-row{ gap:6px; }
    .mora-row.many{ gap:4px; }
    .mora-row.many .mora{ width:44px; height:44px; font-size:25px; }
    .mora-row.many .mora.blank{ font-size:21px; }
    .mora-row.many .mora.blank.filled,.mora-row.many .mora.blank.reveal{ font-size:25px; }
    .choices{ gap:10px; }
    .choice{ font-size:36px; min-height:70px; border-radius:14px; }
    .title-big{ font-size:27px; }
    .level-btn{ font-size:28px; min-height:70px; }
    #judge span{ font-size:130px; }
  }
</style>
</head>

/* ===== 効果音（Web Audio） ===== */
let actx = null;
function beep(freq, dur, delay=0, type="sine", vol=0.25){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+dur);
  }catch(e){}
}
function soundCorrect(){ beep(880,.18); beep(1319,.4,.15); }
function soundTick(){ beep(1046,.12,0,"sine",0.2); }
function soundWrong(){ beep(180,.28,0,"square",0.12); }

/* ===== 音声読み上げ ===== */
function speak(text){
  try{
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = 0.85; u.pitch = 1.0;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

  $(id).classList.add("active");
}

function setMode(m){
  mode = m;
  $("mode-single").classList.toggle("selected", m==="single");
  $("mode-all").classList.toggle("selected", m==="all");
}

function startQuiz(lv){
  level = lv;
  /* 30語からランダムに10問（順序もランダム、難易度は固定） */
  queue = shuffle(DATA[lv]).slice(0, SET_SIZE);
  qIndex = 0; score = 0;
  show("quiz-screen");
  renderQuestion();
}

function renderQuestion(){
  const item = queue[qIndex];
  locked = false; fillIndex = 0; errCount = 0;
  $("judge").className = ""; $("judge").innerHTML = "";

  /* 進捗 */
  $("progress-num").textContent = (qIndex+1) + "/" + queue.length;
  $("progress-fill").style.width = (qIndex / queue.length * 100) + "%";

  /* 刺激（イラスト＋漢字） */
  const il = $("illust");
  if(item.img)       il.innerHTML = `<img src="${item.img}" alt="">`;
  else if(item.svg)  il.innerHTML = SVGS[item.svg];
  else               il.innerHTML = `<span class="emoji">${item.emoji}</span>`;
  $("kanji").textContent = item.kanji;
  $("kanji").className = "kanji" + (item.kanji.length>=3 ? " long" : "");

  /* かなのマス（5モーラ以上はマスを小さく） */
  const morae = [...item.word];
  $("mora-row").classList.toggle("many", morae.length >= 5);
  let opts;
  if(mode === "single"){
    $("mora-row").innerHTML = morae.map((m,i)=>
      i===item.blank
        ? `<div class="mora blank current" id="cell-${i}">？</div>`
        : `<div class="mora">${m}</div>`
    ).join("");
    opts = shuffle([morae[item.blank], ...item.dist]);
  }else{
    $("mora-row").innerHTML = morae.map((m,i)=>
      `<div class="mora blank${i===0?" current":""}" id="cell-${i}">${i===0?"？":""}</div>`
    ).join("");
    /* 6択 = 語の全モーラ（重複除く）＋dist から補充 */
    const uniq = [...new Set(morae)];
    const extra = item.dist.filter(d=>!uniq.includes(d)).slice(0, 6-uniq.length);
    opts = shuffle([...uniq, ...extra]);
  }

  $("choices").innerHTML = opts.map(o=>
    `<button class="choice" onclick="pick(this,'${o}')">${o}</button>`).join("");
}

function pick(btn, kana){
  if(locked || btn.disabled) return;
  const item = queue[qIndex];
  const morae = [...item.word];

  if(mode === "single"){
    const answer = morae[item.blank];
    if(kana === answer){
      locked = true;
      btn.classList.add("right");
      fillCell(item.blank, kana, "filled");
      celebrate(item);
    }else{
      handleWrong(btn, item);
    }
  }else{
    const expected = morae[fillIndex];
    if(kana === expected){
      fillCell(fillIndex, kana, "filled");
      fillIndex++;
      /* この文字がこの後も必要なら押せるまま残す */
      if(!morae.slice(fillIndex).includes(kana)){
        btn.classList.add("used"); btn.disabled = true;
      }
      if(fillIndex >= morae.length){
        locked = true;
        celebrate(item);
      }else{
        soundTick();
        const next = $("cell-"+fillIndex);
        next.classList.add("current");
        next.textContent = "？";
      }
    }else{
      handleWrong(btn, item);
    }
  }
}

/* 2チャンス制：1回目の誤答は選択肢を消して再挑戦、2回目で終了 */
function handleWrong(btn, item){
  errCount++;
  const morae = [...item.word];
  /* 選んだ音は選べなくする（全部モードでこの後必要な音は除く） */
  if(mode === "single" || !morae.slice(fillIndex).includes(btn.textContent)){
    btn.classList.add("wrong");
    btn.disabled = true;
  }
  if(errCount >= 2){ failQuestion(item); return; }
  $("judge").innerHTML = `<span class="batu">×</span>`;
  $("judge").classList.add("show");
  soundWrong();
  setTimeout(()=>{ if($("judge").querySelector(".batu")) $("judge").classList.remove("show"); }, 700);
}

function fillCell(i, kana, cls){
  const cell = $("cell-"+i);
  cell.textContent = kana;
  cell.classList.remove("current");
  cell.classList.add(cls);
}

/* 正答：1回目=〇(1点)、2回目=△(0.5点) */
function celebrate(item){
  const half = errCount > 0;
  score += half ? 0.5 : 1;
  $("judge").innerHTML = half
    ? `<span class="sankaku">△</span>`
    : `<span class="maru">〇</span>`;
  $("judge").classList.add("show");
  soundCorrect();
  setTimeout(()=>speak(item.word), 500);
  document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
  setTimeout(nextQuestion, 2000);
}

/* 2回誤答：×を表示し、正答を青色で提示してから次の問題へ */
function failQuestion(item){
  locked = true;
  const morae = [...item.word];
  if(mode === "single"){
    fillCell(item.blank, morae[item.blank], "reveal");
  }else{
    for(let i=fillIndex; i<morae.length; i++) fillCell(i, morae[i], "reveal");
  }
  $("judge").innerHTML = `<span class="batu">×</span>`;
  $("judge").classList.add("show");
  soundWrong();
  setTimeout(()=>speak(item.word), 600);
  document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
  setTimeout(nextQuestion, 2400);
}

function nextQuestion(){
  qIndex++;
  if(qIndex < queue.length){ renderQuestion(); }
  else{ showResult(); }
}

function showResult(){
  const n = queue.length;
  let stamp, msg;
  if(score >= n*0.9){ stamp="💮"; msg="素晴らしい！"; }
  else if(score >= n*0.6){ stamp="🌸"; msg="よくできました！"; }
  else{ stamp="🌱"; msg="がんばりました！"; }
  $("result-stamp").textContent = stamp;
  $("result-msg").textContent = msg;
  const disp = (score % 1 === 0) ? score : score.toFixed(1);
  $("result-score").innerHTML = `<b>${disp}</b> ／ ${n} 点`;
  $("progress-fill").style.width = "100%";
  show("result-screen");
  speak(msg);
}

function retry(){ startQuiz(level); }
function goHome(){
  window.speechSynthesis && window.speechSynthesis.cancel();
  show("title-screen");
}
</script>
