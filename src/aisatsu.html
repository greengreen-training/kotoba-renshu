<!DOCTYPE html>
<!-- v4 Quality Pass: illustrations, audio, design -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>挨拶語のトレーニング</title>
  <!-- VOICEVOX事前生成音声データ（generate_audio.pyで生成後に配置） -->
  <script src="audio_data.js" onerror="console.log('audio_data.js not found, using live TTS.')"></script>
  <meta name="description" content="失語症（PWA）の方向けに開発された、日常生活の挨拶を音声と視覚で練習できる決定版ロールプレイ・リハビリゲームです。">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Zen+Maru+Gothic:wght@500;700;900&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* ユニバーサルデザインを意識した、ネオ・ブルータリズム配色のスタイリッシュなデザインシステム */
    :root {
      --bg-gradient: linear-gradient(135deg, #fdf6ea 0%, #f6ead7 55%, #f0e2ca 100%); /* 温かみのある上質な生成りグラデーション */
      --text-color: #0f172a;          /* コントラストを高めた濃いネイビー */
      --primary-color: #3b82f6;       /* 明瞭かつ鮮やかなブルー */
      --primary-hover: #2563eb;
      --success-color: #10b981;       /* 成功・言い終わりのグリーン */
      --success-hover: #059669;
      --action-color: #f59e0b;        /* 音声再生用のアンバー */
      --action-hover: #d97706;
      --card-bg: #ffffff;             /* クリスプな白 */
      --border-color: #0f172a;        /* 極太境界線（超濃紺） */
      --danger-color: #ef4444;        /* 終了用のスタイリッシュな赤 */
      --danger-hover: #dc2626;
      --font-family: 'Zen Maru Gothic', 'Noto Sans JP', 'Outfit', sans-serif; /* 丸ゴシックで温かく読みやすく */
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-family);
      background:
        radial-gradient(circle at 12% 18%, rgba(253, 224, 71, 0.16) 0%, transparent 32%),
        radial-gradient(circle at 88% 78%, rgba(125, 211, 252, 0.18) 0%, transparent 36%),
        radial-gradient(rgba(15, 23, 42, 0.05) 1.5px, transparent 1.5px) 0 0 / 26px 26px,
        var(--bg-gradient);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    /* 画面全体のコンテナ（極太境界線＆3D立体シャドウ） */
    .game-container {
      width: 95vw;
      max-width: 950px;
      height: 95vh;
      max-height: 850px;
      background: linear-gradient(180deg, #ffffff 0%, #fffdf8 100%);
      border: 4px solid var(--border-color);
      border-radius: 28px;
      box-shadow: 10px 10px 0px var(--border-color); /* フラットな3D立体影 */
      padding: 16px 20px; /* 上下の余白を縮小 */
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      position: relative;
      gap: 10px; /* 要素間ギャップを縮小 */
      overflow: hidden;
      transition: all 0.3s ease;
    }
    @media (min-width: 480px) {
      .game-container { padding: 18px 24px; }
    }
    /* 立体3Dボタン */
    .btn {
      font-family: inherit;
      font-size: 25px;               /* 大きく明瞭なフォントサイズ */
      font-weight: 900;
      padding: 16px 36px;            /* 特大タップ領域 */
      border: 4px solid var(--border-color);
      border-radius: 60px;
      cursor: pointer;
      transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.1s;
      box-shadow: 0 6px 0 var(--border-color);
      text-align: center;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 480px;
      white-space: nowrap;           /* ボタン内テキストの自動改行を完全に禁止 */
    }
    
    .btn:hover, .btn:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 10px 0 var(--border-color);
      outline: none;
    }
    .btn:active {
      transform: translateY(6px);
      box-shadow: 0 0px 0 var(--border-color);
    }
    .btn:disabled {
      background-color: #cbd5e1 !important;
      color: #64748b !important;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: 0 4px 0 var(--border-color) !important;
      opacity: 0.6;
    }
    .btn-primary { background-color: var(--primary-color); color: white; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    
    .btn-success { 
      background-color: var(--success-color); 
      color: white; 
      font-size: 32px;               /* さらに目立つ大きさ */
      padding: 20px 46px; 
    }
    .btn-success:hover { background-color: var(--success-hover); }
    
    .btn-action { background-color: var(--action-color); color: var(--text-color); }
    .btn-action:hover { background-color: var(--action-hover); }
    
    .btn-secondary { background-color: #64748b; color: white; }
    .btn-secondary:hover { background-color: #475569; }
    
    .btn-danger { background-color: var(--danger-color); color: white; }
    .btn-danger:hover { background-color: var(--danger-hover); }
    /* 共通：非表示クラス */
    .hidden { display: none !important; }
    /* 単語・文節の途中改行バグ修正 */
    .keep-words {
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    
    .keep-words span {
      display: inline-block;
    }
    /* ルビ（ふりがな）の調整 */
    ruby {
      ruby-position: over;
    }
    rt {
      font-size: 0.52em;
      font-weight: 900;
      color: #475569;
      letter-spacing: 0.05em;
      padding-bottom: 0.15em;
      user-select: none;
    }
    /* 1. ステージ選択画面 */
    #stage-select-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    .stage-list-container {
      flex: 1;
      overflow-y: auto; 
      padding-bottom: 20px;
    }
    #stage-select-screen h1 {
      text-align: center;
      font-size: 34px;
      margin-top: 0px;
      margin-bottom: 4px;
      color: var(--text-color);
      font-weight: 900;
    }
    .stage-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 4px;
    }
    @media (min-width: 600px) {
      .stage-grid { grid-template-columns: repeat(3, 1fr); } 
    }
    
    /* ステージ選択カード */
    .stage-card {
      background: #faf8f5;
      padding: 12px 16px; 
      border-radius: 16px;
      font-size: 18px; 
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 0 var(--border-color); 
      user-select: none;
      border: 3px solid var(--border-color);
    }
    .stage-card:hover, .stage-card:focus-visible {
      background: #ffffff;
      border-color: var(--primary-color);
      outline: none;
      transform: translateY(-3px);
      box-shadow: 0 7px 0 var(--border-color);
    }
    .stage-card:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--border-color);
    }
    .stage-emoji {
      font-size: 28px; 
      width: 44px;
      height: 44px;
      background-color: #eff6ff;
      border-radius: 12px; 
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--border-color);
      flex-shrink: 0;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .stage-card:hover .stage-emoji {
      transform: scale(1.15) rotate(4deg); 
    }
    .stage-text-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    /* 2. メインゲーム画面 (練習画面) */
    #game-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100%;
      gap: 12px;
      min-height: 0;
      overflow: hidden;
    }
    /* ヘッダー情報表示 */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px dashed var(--border-color);
      padding-bottom: 8px;
      flex-shrink: 0;
    }
    .game-title {
      font-size: 28px;
      font-weight: 900;
    }
    .step-badge {
      font-size: 20px;
      font-weight: 900;
      background-color: #e2e8f0;
      padding: 6px 18px;
      border-radius: 30px;
      border: 3px solid var(--border-color);
    }
    
    /* 上部：状況説明 / 正解提示エリア */
    .game-text-area {
      height: 90px;
      min-height: 90px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 12px;
      background-color: #f8fafc;
      border: 3px solid var(--border-color);
      border-radius: 16px;
      overflow-y: auto;
    }
    .scene-instruction-text {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.4;
    }
    /* 中央：アニメーション舞台 */
    .stage-view {
      flex: 1;
      min-height: 0;
      width: 100%;
      background-color: #f1f5f9;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 4px solid var(--border-color);
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.05);
    }
    .image-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .stage-image {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      user-select: none;
      border-radius: 16px;
      border: 3px solid var(--border-color);
      box-shadow: 6px 6px 0px var(--border-color);
      background-color: white;
    }
    /* 画像がない場合のプレースホルダー */
    .image-placeholder {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 85%;
      height: 85%;
      background: #ffffff;
      border: 4px solid var(--border-color);
      border-radius: 24px;
      padding: 16px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 8px 8px 0px var(--border-color);
    }
    .placeholder-icon {
      font-size: clamp(60px, 15vh, 110px); 
      margin-bottom: 10px;
      filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.1));
    }
    .placeholder-text {
      font-size: clamp(16px, 3vh, 22px);
      font-weight: 900;
      color: #475569;
      margin-bottom: 4px;
    }
    .placeholder-filename {
      font-size: clamp(11px, 2vh, 14px);
      color: #94a3b8;
      font-family: monospace;
      word-break: break-all;
    }
    @keyframes image-pop {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .stage-image.pop-animation, .image-placeholder.pop-animation {
      animation: image-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
    }
    /* 問いかけテキストのフキダシ */
    .prompt-overlay {
      position: absolute;
      bottom: 14px;
      top: auto;
      background: rgba(0, 0, 0, 0.88);
      color: white;
      padding: 14px 40px;
      border-radius: 14px;
      font-size: 34px;
      font-weight: bold;
      text-align: center;
      z-index: 10;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s ease-out;
      pointer-events: none;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }
    .prompt-overlay.show {
      opacity: 1;
      transform: translateY(0);
    }
    .prompt-overlay::after {
      content: '';
      position: absolute;
      top: -12px;
      bottom: auto;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 12px 12px;
      border-style: solid;
      border-color: transparent transparent rgba(0,0,0,0.88);
      display: block;
      width: 0;
    }
    /* 下部：操作ボタンエリア */
    .control-area {
      min-height: 130px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      z-index: 10;
      padding: 8px 0;
    }
    /* 録音中インジケータ */
    .recording-status {
      background: var(--danger-color);
      color: white;
      padding: 10px 30px;
      border-radius: 30px;
      font-weight: 900;
      font-size: 24px;
      animation: pulse 1.4s infinite;
      box-shadow: 4px 4px 0px var(--border-color);
      border: 3px solid var(--border-color);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
    @keyframes pulse {
      0% { opacity: 0.75; transform: scale(0.97); }
      50% { opacity: 1; transform: scale(1.03); }
      100% { opacity: 0.75; transform: scale(0.97); }
    }
    /* フィードバック正解テキスト */
    .correct-answer-card {
      color: var(--success-color);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .correct-answer-card span {
      display: inline-block;
      font-size: 20px;
      color: #64748b;
      margin: 0;
      font-weight: 900;
    }
    .correct-answer-word {
      font-size: 30px;
      font-weight: 900;
      color: var(--success-color);
      background-color: #e6fcf5;
      padding: 6px 18px;
      border-radius: 16px;
      border: 3px solid var(--border-color);
      box-shadow: 4px 4px 0px var(--border-color);
      display: inline-block;
      white-space: nowrap;
    }
    /* フィードバック画面のボタンナビゲーション */
    .navigation-buttons-row {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      align-items: center;
    }
    @media (min-width: 600px) {
      .navigation-buttons-row {
        flex-direction: row;
        justify-content: center;
        max-width: 800px;
        gap: 20px;
      }
      .navigation-buttons-row .btn {
        max-width: none;
        flex: 1;
      }
    }
    /* マイクエラー警告モーダル */
    .warning-modal-backdrop {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border-radius: 20px;
    }
    .warning-modal-backdrop.active {
      display: flex;
    }
    .warning-modal-card {
      background: white;
      border: 4px solid var(--text-color);
      border-radius: 20px;
      padding: 32px;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
      text-align: center;
    }
    .warning-modal-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }
    .warning-modal-title {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 16px;
    }
    .warning-modal-desc {
      font-size: 20px;
      color: #475569;
      margin-bottom: 24px;
      line-height: 1.6;
      font-weight: bold;
    }
    /* インラインSVGイラスト */
    .scene-illust {
      width: 92%;
      height: 92%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .scene-illust svg {
      max-width: 100%;
      max-height: 100%;
      border: 3px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 6px 6px 0px var(--border-color);
      background-color: white;
    }
    /* AI生成イラスト（webp）も同じ額縁スタイルで表示 */
    .scene-illust .scene-photo {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border: 3px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 6px 6px 0px var(--border-color);
      background-color: white;
    }
    .scene-illust.pop-animation {
      animation: image-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
    }
    /* コマ進行ドット（●＝コマ、■＝問いかけ） */
    .frame-dots { display: flex; gap: 8px; align-items: center; }
    .frame-dots .dot {
      width: 16px; height: 16px; border-radius: 50%;
      border: 3px solid var(--border-color);
      background: #e2e8f0;
      transition: background 0.3s;
    }
    .frame-dots .dot.active { background: var(--primary-color); }
    .frame-dots .dot.question { border-radius: 4px; }
    .frame-dots .dot.question.active { background: var(--success-color); }

    /* ==========================================================
       v4 クオリティパス：シーンSVGアニメーション
       （インラインSVGは親ドキュメントのCSSを継承する）
       ========================================================== */
    .scene-svg .anm-drift { animation: sceneDrift 34s ease-in-out infinite alternate; }
    @keyframes sceneDrift {
      from { transform: translateX(-14px); }
      to   { transform: translateX(26px); }
    }
    .scene-svg .anm-steam { animation: steamRise 2.8s ease-in-out infinite; }
    @keyframes steamRise {
      0%   { transform: translateY(0);     opacity: 0.85; }
      60%  { transform: translateY(-8px);  opacity: 0.45; }
      100% { transform: translateY(-14px); opacity: 0; }
    }
    .scene-svg .anm-twinkle  { animation: starTwinkle 2.4s ease-in-out infinite; }
    .scene-svg .anm-twinkle2 { animation: starTwinkle 2.4s ease-in-out 1.2s infinite; }
    @keyframes starTwinkle {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }
    .scene-svg .anm-bob  { animation: charaBob 3.4s ease-in-out infinite; }
    .scene-svg .anm-bob2 { animation: charaBob 3.4s ease-in-out 0.9s infinite; }
    @keyframes charaBob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }
    .scene-svg .anm-sun {
      transform-box: fill-box;
      transform-origin: center;
      animation: sunPulse 4.5s ease-in-out infinite;
    }
    @keyframes sunPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }
    .scene-svg .anm-heart {
      transform-box: fill-box;
      transform-origin: center;
      animation: heartBeat 1.4s ease-in-out infinite;
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.16); }
      28% { transform: scale(1); }
      42% { transform: scale(1.1); }
      56% { transform: scale(1); }
    }

    /* --- 正解のおいわい演出（紙吹雪＋ほめことば） --- */
    .praise-banner {
      position: absolute;
      top: 14px;
      left: 50%;
      background: linear-gradient(180deg, #ffffff, #fef9c3);
      border: 4px solid var(--border-color);
      border-radius: 60px;
      padding: 10px 34px;
      font-size: clamp(22px, 4vh, 30px);
      font-weight: 900;
      color: #e11d48;
      box-shadow: 6px 6px 0 var(--border-color);
      z-index: 41;
      white-space: nowrap;
      animation: praisePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.4) both;
      pointer-events: none;
    }
    @keyframes praisePop {
      0%   { transform: translateX(-50%) scale(0.3); opacity: 0; }
      100% { transform: translateX(-50%) scale(1);   opacity: 1; }
    }
    .confetti-piece {
      position: absolute;
      top: -18px;
      border-radius: 3px;
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      animation-name: confettiFall;
      animation-timing-function: cubic-bezier(0.3, 0.4, 0.6, 1);
      animation-fill-mode: forwards;
    }
    @keyframes confettiFall {
      0%   { opacity: 1;   transform: translateY(0) rotate(0deg); }
      100% { opacity: 0.9; transform: translateY(var(--fy, 480px)) rotate(var(--rot, 720deg)); }
    }

    /* --- 録音中の声メーター --- */
    .vu-meter {
      display: inline-flex;
      gap: 4px;
      align-items: flex-end;
      height: 26px;
    }
    .vu-meter span {
      width: 7px;
      height: 4px;
      background: #ffffff;
      border-radius: 4px;
      transition: height 0.09s linear;
    }

    /* --- キャラクター（主人公）選択画面 --- */
    #char-select-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      border-radius: 24px;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      background:
        radial-gradient(circle at 18% 12%, rgba(254, 240, 138, 0.55) 0%, transparent 38%),
        radial-gradient(circle at 85% 85%, rgba(186, 230, 253, 0.55) 0%, transparent 42%),
        #fffdf5;
    }
    #char-select-screen h1 {
      margin: 8px 0 2px;
      font-size: clamp(24px, 4.5vw, 38px);
      font-weight: 900;
      color: var(--text-color);
    }
    .char-select-sub {
      color: #64748b;
      font-weight: 700;
      font-size: clamp(14px, 2.5vw, 18px);
      margin: 0 0 20px;
    }
    .char-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(140px, 200px));
      gap: 16px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 460px;
      justify-content: center;
    }
    @media (min-width: 680px) {
      .char-grid { grid-template-columns: repeat(4, 1fr); max-width: 780px; }
    }
    .char-card {
      font-family: inherit;
      border: 4px solid var(--border-color);
      border-radius: 20px;
      padding: 14px 8px 12px;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--border-color);
      transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.12s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .char-card:hover, .char-card:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 10px 0 var(--border-color);
      outline: none;
    }
    .char-card:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--border-color);
    }
    .char-card svg { width: clamp(76px, 12vw, 108px); height: auto; }
    .char-card:hover svg { animation: charaBob 1.4s ease-in-out infinite; }
    .char-card .char-name { font-weight: 900; font-size: clamp(15px, 2.4vw, 19px); color: var(--text-color); }
    .char-card:nth-child(1) { background: linear-gradient(180deg, #fdf2f8, #fce7f3); }
    .char-card:nth-child(2) { background: linear-gradient(180deg, #eff6ff, #dbeafe); }
    .char-card:nth-child(3) { background: linear-gradient(180deg, #f0fdf4, #dcfce7); }
    .char-card:nth-child(4) { background: linear-gradient(180deg, #fffbeb, #fef3c7); }
    .char-note { font-size: 13px; color: #94a3b8; font-weight: 700; margin: 0; }

    /* --- ステージカードのアクセントカラー --- */
    .stage-card:nth-child(8n+1) .stage-emoji { background: #ffedd5; }
    .stage-card:nth-child(8n+2) .stage-emoji { background: #e0f2fe; }
    .stage-card:nth-child(8n+3) .stage-emoji { background: #ede9fe; }
    .stage-card:nth-child(8n+4) .stage-emoji { background: #fce7f3; }
    .stage-card:nth-child(8n+5) .stage-emoji { background: #fef9c3; }
    .stage-card:nth-child(8n+6) .stage-emoji { background: #ccfbf1; }
    .stage-card:nth-child(8n+7) .stage-emoji { background: #dbeafe; }
    .stage-card:nth-child(8n+8) .stage-emoji { background: #fef3c7; }

    /* --- 問いかけフキダシの強調（ゆらゆら＋アクセントリング） --- */
    .prompt-overlay {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.94), rgba(15, 23, 42, 0.94));
      border: 3px solid rgba(251, 191, 36, 0.85);
    }
    .prompt-overlay.show { animation: promptFloat 2.6s ease-in-out 0.5s infinite; }
    @keyframes promptFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }

    /* --- 動きを減らす設定への配慮 --- */
    @media (prefers-reduced-motion: reduce) {
      .scene-svg [class^="anm-"], .scene-svg [class*=" anm-"],
      .prompt-overlay.show, .char-card:hover svg, .confetti-piece {
        animation: none !important;
      }
    }

    /* --- スマートフォン向けレイアウト調整（〜480px） --- */
    @media (max-width: 480px) {
      .game-container {
        padding: 12px 12px;
        gap: 8px;
      }
      /* ナレーション字幕：文節ごとに折り返し、はみ出しを防ぐ */
      .scene-instruction-text {
        font-size: clamp(18px, 5.4vw, 24px);
        line-height: 1.5;
        word-break: keep-all;
        overflow-wrap: break-word;
      }
      .scene-instruction-text span {
        display: inline-block;
        max-width: 100%;
      }
      /* ボタン：nowrapを解除して画面幅に収める */
      .btn {
        font-size: clamp(17px, 5vw, 23px) !important;
        padding: 13px 16px !important;
        gap: 8px;
        white-space: normal;
        word-break: keep-all;
        overflow-wrap: break-word;
        line-height: 1.35;
        max-width: 100%;
      }
      .btn-success {
        font-size: clamp(20px, 6vw, 28px) !important;
        padding: 16px 18px !important;
      }
      .btn span {
        display: inline-block;
        max-width: 100%;
      }
      /* 正解表示カード：縦積みにして横はみ出しを防ぐ */
      .correct-answer-card {
        flex-direction: column;
        gap: 6px;
      }
      .correct-answer-card span {
        font-size: 16px;
      }
      .correct-answer-word {
        font-size: clamp(20px, 6.2vw, 28px);
        padding: 6px 14px;
        white-space: normal;
        word-break: keep-all;
        max-width: 100%;
      }
      /* 見出し・インジケーター類の縮小 */
      #stage-select-screen h1 {
        font-size: clamp(22px, 6.5vw, 30px);
      }
      .keep-words {
        overflow-wrap: break-word;
      }
    }
  </style>
</head>

        s += bag(cx+bodyW*0.95, elbY+2*sc, sc*0.85);

        s += '<path d="M' + (cx+bodyW*0.48) + ',' + shouldY + ' Q' + (cx+bodyW*0.62) + ',' + (shouldY+bodyH*0.3) + ' ' + (cx+bodyW*0.65) + ',' + elbY + '" fill="none" stroke="#fcd9b8" stroke-width="' + armW + '" stroke-linecap="round"/>';
      }
      s += '<path d="M' + (cx-9*sc) + ',' + (hcy+hr*0.8) + ' L' + (cx-9*sc) + ',' + bodY + ' L' + (cx+9*sc) + ',' + bodY + ' L' + (cx+9*sc) + ',' + (hcy+hr*0.8) + '" fill="#fcd9b8" stroke="none"/>';

  // 倍音レイヤー＋ソフトアタック＋ローパスで、耳にやさしいマリンバ風の音色に
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const sfxMaster = audioCtx.createGain();
  sfxMaster.gain.value = 0.9;
  sfxMaster.connect(audioCtx.destination);

  function synthNote(freq, opt) {
    opt = opt || {};
    const type = opt.type || 'sine';
    const dur = opt.dur || 0.3;
    const delay = opt.delay || 0;
    const vol = opt.vol || 0.09;
    setTimeout(() => {
      try {
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        const t0 = audioCtx.currentTime;
        const env = audioCtx.createGain();
        env.gain.setValueAtTime(0.0001, t0);
        env.gain.exponentialRampToValueAtTime(vol, t0 + 0.015); // ソフトアタック
        env.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        const lp = audioCtx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = Math.min(freq * 6, 9000);
        // 基音＋控えめな倍音で丸みのある音色を合成
        [[1, 1], [2.005, 0.28], [3.01, 0.09]].forEach(h => {

          osc.type = type;
          osc.frequency.setValueAtTime(freq * h[0], t0);
          const g = audioCtx.createGain();
          g.gain.value = h[1];
          osc.connect(g);
          g.connect(env);
          osc.start(t0);
          osc.stop(t0 + dur + 0.05);

  // タイムアウト付きfetchヘルパー（AbortSignal.timeoutの非対応ブラウザ対応）
  function fetchWithTimeout(url, options, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    return fetch(url, Object.assign({}, options, { signal: controller.signal }))
      .finally(() => clearTimeout(timer));
  }

  // 起動時にVOICEVOXが使えるか確認
  async function checkVoicevox() {
    const badge = document.getElementById('voicevox-badge');
    try {
      const res = await fetchWithTimeout('http://localhost:50021/version', { method: 'GET' }, 2000);
      if (!res.ok) throw new Error('version endpoint not ok');

      // スピーカーリストを取得
      const spRes = await fetchWithTimeout('http://localhost:50021/speakers', { method: 'GET' }, 3000);
      if (!spRes.ok) throw new Error('speakers endpoint not ok');
      const speakers = await spRes.json();

      // 最初のスタイルをデフォルトに
      if (speakers.length > 0 && speakers[0].styles.length > 0) {
        voicevoxSpeakerId = speakers[0].styles[0].id;
      }

      // セレクトボックスを構築
      const select = document.getElementById('voicevox-speaker-select');
      if (select) {
        select.innerHTML = '';
        speakers.forEach(sp => {
          sp.styles.forEach(style => {
            const opt = document.createElement('option');
            opt.value = style.id;
            opt.textContent = sp.name + '（' + style.name + '）';
            if (style.id === voicevoxSpeakerId) opt.selected = true;
            select.appendChild(opt);
          });
        });
        select.addEventListener('change', () => {
          voicevoxSpeakerId = parseInt(select.value);
        });
      }

      // テスト再生ボタン

  // VOICEVOX経由で読み上げ
  async function speakWithVoicevox(text, callback) {
    const cleanText = text.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
    try {
      const queryRes = await fetchWithTimeout(
        'http://localhost:50021/audio_query?text=' + encodeURIComponent(cleanText) + '&speaker=' + voicevoxSpeakerId,
        { method: 'POST' },
        5000
      );
      if (!queryRes.ok) throw new Error('audio_query failed');
      const query = await queryRes.json();
      query.speedScale = 0.90; // 少しゆっくり

      const synthRes = await fetchWithTimeout(
        'http://localhost:50021/synthesis?speaker=' + voicevoxSpeakerId,
        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(query) },
        10000
      );
      if (!synthRes.ok) throw new Error('synthesis failed');

      const blob = await synthRes.blob();
      const url = URL.createObjectURL(blob);
      voicevoxAudio = new Audio(url);

      let done = false;
      const finish = () => {
        if (done) return; done = true;
        URL.revokeObjectURL(url);
        voicevoxAudio = null;
        if (callback) callback();
      };
      voicevoxAudio.onended = finish;
      voicevoxAudio.onerror = () => { finish(); };
      voicevoxAudio.play().catch(() => finish());
    } catch(e) {
      console.warn('VOICEVOX speakText error:', e);
      // フォールバック：Web Speech API
      speakWithWebSpeech(cleanText, callback);
    }
  }

  // Web Speech API経由で読み上げ（フォールバック）
  function speakWithWebSpeech(text, callback) {
    if (!('speechSynthesis' in window)) {
      if (callback) setTimeout(callback, 2000);
      return;
    }
    window.speechSynthesis.cancel();
    const cleanText = text.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ');
    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = 'ja-JP';
    utterance.rate = 0.85;
    utterance.pitch = 1.0;
    if (selectedVoice) utterance.voice = selectedVoice;

    let callbackCalled = false;
    const triggerCallback = () => {
      if (!callbackCalled) {
        callbackCalled = true;
        if (speechTimeout) { clearTimeout(speechTimeout); speechTimeout = null; }
        if (callback) callback();
      }
    };
    utterance.onend = triggerCallback;
    utterance.onerror = triggerCallback;
    const safetyDuration = (cleanText.length * 450) + 2000;
    speechTimeout = setTimeout(() => {
      console.warn('SpeechSynthesis onend failed to fire. Triggering safety callback.');
      window.speechSynthesis.cancel();
      triggerCallback();
    }, safetyDuration);
    window.speechSynthesis.speak(utterance);
  }

  // 事前生成音声で再生（audio_data.js読み込み済みの場合）
  function speakWithPregenerated(text, callback) {
    var key = textToAudioKey(text);
    if (!key || typeof VOICEVOX_AUDIO === 'undefined' || !VOICEVOX_AUDIO[key]) return false;
    if (voicevoxAudio) { voicevoxAudio.pause(); voicevoxAudio = null; }
    var audio = new Audio(VOICEVOX_AUDIO[key]);

    var done = false;
    var finish = function() {
      if (done) return; done = true;
      voicevoxAudio = null;
      if (callback) callback();
    };
    audio.onended = finish;
    audio.onerror = finish;
    audio.play().catch(finish);
    return true;
  }

  // ===== AI生成イラスト（あれば最優先で表示、なければSVGにフォールバック） =====
  const SCENE_IMG_DIR = 'images/';
  const SCENE_IMG_ALL = ['m1','m2','n1','n2','y1','y2','g1','g2','e1','e2','e3','e4','d1','d2','d3','d4','t1','t2','h1','h2','h3','h4'];
  const SCENE_IMG = {

    young_male: SCENE_IMG_ALL,

  };
  const SCENE_IMG_SHARED = ['e1','e4']; // 主人公が登場しない共用シーン（hanaの画像を使い回す）
  const SCENE_IMG_FAILED = {};

  // シーンの描画（AI画像 → SVG → 電球マークの順にフォールバック）
  function renderScene(sceneId) {
    const proto = window.PROTAGONIST || 'hana';
    const list = SCENE_IMG[proto];
    const key = proto + ':' + sceneId;
    if (list && list.indexOf(sceneId) !== -1 && !SCENE_IMG_FAILED[key]) {
      const owner = SCENE_IMG_SHARED.indexOf(sceneId) !== -1 ? 'hana' : proto;
      const src = SCENE_IMG_DIR + owner + '_' + sceneId + '.webp';
      sceneContainer.innerHTML = '<img class="scene-photo" src="' + src + '" alt="場面イラスト">';
      const img = sceneContainer.querySelector('img');
      img.onerror = () => {
        SCENE_IMG_FAILED[key] = true; // 以降このシーンはSVGを使う
        renderSceneSvg(sceneId);
      };
    } else {
      renderSceneSvg(sceneId);
    }
    sceneContainer.classList.remove('pop-animation');
    void sceneContainer.offsetWidth;
    sceneContainer.classList.add('pop-animation');
  }

  function renderSceneSvg(sceneId) {
    const renderer = (typeof SCENES !== 'undefined') && SCENES[sceneId];

  // コマを進める処理
  function advanceFrame() {
    if (frameTimeout) {
      clearTimeout(frameTimeout);
      frameTimeout = null;

    stopAllSpeech();

    const step = currentStageSteps[currentStepIndex];
    currentFrameIndex++;

    if (currentFrameIndex < step.frames.length) {
      showFrame();
    } else {
      enterQuestionPhase();
    }

    // 4. 「何と言いますか？」と音声で問いかけ、それが「完全に終わってから」録音開始する
    speakText("なんといいますか？", async () => {
      // 5. 話し終えたら、下部コントロールを「おはなし中」表示と「言い終わった」ボタンに切り替える
      controlArea.innerHTML = `
        <div id="recording-status" class="recording-status">
          <span>🎙️ おはなし中</span>
          <span id="vu-meter" class="vu-meter" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span>
        </div>
        <button id="btn-finish" class="btn btn-success" style="margin-top: 10px; padding: 18px 46px; font-size: 30px;">
          <span>✅ 言い終わった</span>
        </button>
      `;

      // イベントバインド
      document.getElementById('btn-finish').addEventListener('click', () => {
        playChimeClick();
        onSpeechFinish();
      });

      // 6. バックグラウンド録音を自動開始
      await triggerMicRecording();
    });
  }

  // MediaRecorderによる録音処理
  async function triggerMicRecording() {
    if (!isRecordingSupported) {
      return; // マイク非対応時はビジュアルのみで継続
    }

    audioChunks = [];
    try {
      // 既に取得済みのストリームが生きていれば再利用（許可ダイアログは初回のみ）
      if (!micStream || !micStream.active) {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      }
      mediaRecorder = new MediaRecorder(micStream);
      
      mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) {
          audioChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = () => {
        const options = mediaRecorder.mimeType ? { type: mediaRecorder.mimeType } : { type: 'audio/webm' };
        audioBlob = new Blob(audioChunks, options);
        audioUrl = URL.createObjectURL(audioBlob);
        if (audioPlayer) {
          audioPlayer.pause();
        }
        audioPlayer = new Audio(audioUrl);
        
        // 聞いてみるボタンを有効化
        const btnListen = document.getElementById('btn-listen');
        if (btnListen) {
          btnListen.disabled = false;
        }
      };

      mediaRecorder.start();
      startVuMeter(); // 声のメーターを動かす（声が届いている安心感）
    } catch (err) {
      console.error("Failed to capture user microphone stream:", err);
      isRecordingSupported = false;
      
      // 警告モーダルを表示
      micWarningOverlay.classList.add('active');
    }
  }

  // ===== 録音中の声メーター（AnalyserNode） =====
  let vuRaf = null, vuAnalyser = null, vuSource = null, vuStream = null;

  function startVuMeter() {
    const meter = document.getElementById('vu-meter');
    if (!meter || !micStream) return;
    try {
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }
      if (vuStream !== micStream) {
        // ストリームが変わっていたら作り直す
        try { if (vuSource) vuSource.disconnect(); } catch (e) {}
        vuSource = audioCtx.createMediaStreamSource(micStream);
        vuAnalyser = audioCtx.createAnalyser();
        vuAnalyser.fftSize = 256;
        vuAnalyser.smoothingTimeConstant = 0.75;
        vuSource.connect(vuAnalyser); // destinationには繋がない（ハウリング防止）
        vuStream = micStream;
      }
      const data = new Uint8Array(vuAnalyser.frequencyBinCount);
      const bars = meter.querySelectorAll('span');
      const tick = () => {
        vuAnalyser.getByteFrequencyData(data);
        let sum = 0;
        for (let i = 2; i < 42; i++) sum += data[i];
        const level = Math.min(1, (sum / 40) / 130);
        bars.forEach((b, i) => {
          const wave = 0.5 + 0.5 * Math.sin(Date.now() / 130 + i * 1.15);
          b.style.height = Math.max(4, 4 + level * wave * 22) + 'px';
        });
        vuRaf = requestAnimationFrame(tick);
      };
      tick();
    } catch (e) { console.warn('VU meter unavailable:', e); }
  }

  function stopVuMeter() {
    if (vuRaf) { cancelAnimationFrame(vuRaf); vuRaf = null; }
  }

  // 録音の強制停止
  function stopMicRecording() {
    stopVuMeter();
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      try {
        mediaRecorder.stop(); // ストリーム自体は維持して使い回す
      } catch (e) {
        console.error("Error stopping MediaRecorder:", e);
      }
    }
  }

  // 言い終わったボタンを押した時：録音停止とフィードバック画面へ
  function onSpeechFinish() {
    stopMicRecording();
    playChimeSuccess();
    setupFeedbackPanel();
  }

  // ===== 正解のおいわい演出（ほめことば＋紙吹雪） =====
  const PRAISES = ['すばらしい！', 'よく いえました！', 'その ちょうし！', 'バッチリです！', 'じょうずです！'];

  function clearCelebration() {
    stageView.querySelectorAll('.praise-banner, .confetti-piece').forEach(el => el.remove());
  }

  function showCelebration() {
    clearCelebration();
    const banner = document.createElement('div');
    banner.className = 'praise-banner';
    banner.textContent = '🌟 ' + PRAISES[Math.floor(Math.random() * PRAISES.length)];
    stageView.appendChild(banner);

    const colors = ['#f43f5e', '#f59e0b', '#10b981', '#3b82f6', '#a855f7', '#facc15'];
    const fallY = stageView.clientHeight + 40;
    for (let i = 0; i < 26; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      const sz = 7 + Math.random() * 9;
      p.style.width = sz + 'px';
      p.style.height = (sz * (0.4 + Math.random() * 0.6)) + 'px';
      p.style.left = (4 + Math.random() * 92) + '%';
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
      p.style.animationDelay = (Math.random() * 0.35) + 's';
      p.style.setProperty('--fy', fallY + 'px');
      p.style.setProperty('--rot', (360 + Math.random() * 540) + 'deg');
      stageView.appendChild(p);
    }
    setTimeout(clearCelebration, 3400);
  }

  // フィードバックパネルの情報をセットして下部にコントロールを表示
  function setupFeedbackPanel() {
    const step = currentStageSteps[currentStepIndex];

    // 頭上のフキダシを隠す
    promptText.classList.remove('show');

    // ほめことば＋紙吹雪のおいわい
    showCelebration();

    // 上部テキストエリアを「正解（せいかい）」表示に更新
    instructionTextContainer.innerHTML = `
      <div class="correct-answer-card">
        <span>🌟 正解（せいかい）</span>
        <div class="correct-answer-word">${step.targetWord}</div>
      </div>
    `;

    // お手本の言葉を読み上げ
    speakText(step.targetWord);

    // 下部コントロールに「聞いてみる」「もう一度」「おわる/つぎへ」の特大ボタンを配置
    const isLastStep = currentStepIndex === currentStageSteps.length - 1;

    controlArea.innerHTML = `
      <button id="btn-listen" class="btn btn-action" style="margin-bottom: 8px; font-size: 24px; padding: 14px 36px;" disabled>
        <span>🔊 自分の声をきく</span>
      </button>
      <div class="navigation-buttons-row">
        <button id="btn-retry" class="btn btn-secondary" style="font-size: 24px; padding: 14px 30px;">
          <span>↩️ もう一度</span>
        </button>
        <button id="btn-next-or-end" class="btn ${isLastStep ? 'btn-danger' : 'btn-primary'}" style="font-size: 24px; padding: 14px 30px;">
          ${isLastStep ? '<span>🚪 おわる</span>' : `<span>➡️ 次のセリフへ</span>`}
        </button>
      </div>
    `;

    // イベントバインド
    document.getElementById('btn-listen').addEventListener('click', () => {
      playTone(587.33, 'sine', 0.1);
      playUserRecordedAudio();
    });

    document.getElementById('btn-retry').addEventListener('click', () => {
      playChimeClick();
      resetCurrentStep();
    });

    document.getElementById('btn-next-or-end').addEventListener('click', () => {
      playChimeClick();
      handleStepNavigation();
    });

    // 既に録音が完了している場合はすぐに「きく」ボタンを有効化
    if (audioUrl) {
      document.getElementById('btn-listen').disabled = false;
    }
  }

  // 録音データの再生
  function playUserRecordedAudio() {
    if (audioPlayer) {
      audioPlayer.currentTime = 0;
      audioPlayer.play().catch(err => {
        console.error("Audio play failed:", err);
      });
    }
  }

  // もう一度練習する
  function resetCurrentStep() {
    setupStepInterface();
  }

  // ナビゲーション処理
  function handleStepNavigation() {
    if (currentStepIndex < currentStageSteps.length - 1) {
      currentStepIndex++;
      setupStepInterface();
    } else {
      // 終了：ステージ選択画面へ戻る
      currentStage = null;
      currentStageSteps = [];
      
      gameScreen.classList.add('hidden');
      stageSelectScreen.classList.remove('hidden');
    }
  }
</script>
