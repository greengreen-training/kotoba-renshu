<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2e8b57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="助詞の練習">
<title>助詞の練習アプリ｜グリーン・グリーン</title>
<style>
:root{
  --main:#2e8b57; --dmain:#1e5c3a; --lmain:#e8f5ec; --llmain:#f3faf5;
  --ok:#2e8b57; --lok:#e6f5ec;
  --tri:#d99000; --ltri:#fdf3e0;
  --ng:#c0504d; --lng:#faeceb;
  --gray:#666; --lgray:#ccc; --bg:#f6f9f6;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg);
  font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  color:#222;}
#app{max-width:900px; margin:0 auto; padding:24px 20px 60px;}
button{font-family:inherit; cursor:pointer;}
rt{font-size:0.42em; color:var(--gray); font-weight:normal; letter-spacing:0;}

/* ---------- ホーム ---------- */
.banner{position:relative; overflow:hidden;
  background:linear-gradient(150deg,#eaf7ee 0%,#dff1e4 60%,#d2ecdc 100%);
  border-radius:18px; padding:40px 16px 30px; text-align:center; margin-bottom:26px;
  border:1.5px solid #cfe8d8;}
.banner .titlerow{display:flex; align-items:center; justify-content:center; gap:16px; margin-top:6px;}
.banner .logo{width:72px; height:auto; background:transparent;}
.banner .org{color:var(--dmain); font-size:1.05em; letter-spacing:1px; margin-bottom:12px; font-weight:bold;}
.banner h1{margin:0; font-size:2.1em; color:var(--dmain);}
.banner p{margin:14px 0 0; color:#4a6b57; font-size:1.05em;}
.leaf{position:absolute; pointer-events:none;}
.topbar{display:flex; justify-content:flex-end; margin-bottom:10px;}
.soundbtn{border:1.5px solid var(--lgray); background:#fff; border-radius:12px;
  font-size:1.05em; padding:10px 18px; color:#444;}
.diffbtns{display:flex; flex-direction:column; gap:20px; max-width:560px; margin:0 auto;}
.dbtn{position:relative; text-align:left; background:#fff; border:2.5px solid #cfe8d8;
  border-radius:20px; padding:26px 28px; display:flex; align-items:center; gap:22px;}
.dbtn:hover{border-color:var(--main);}
.dbtn .name{font-size:1.9em; font-weight:bold; color:var(--dmain); min-width:4.2em;}
.dbtn .info{flex:1;}
.dbtn .stars{color:#e8a200; font-size:1.15em; letter-spacing:3px;}
.dbtn .desc{color:var(--gray); font-size:1em; margin-top:6px; line-height:1.5;}
.dbtn .best{font-size:1em; color:var(--main); font-weight:bold; margin-top:6px; min-height:1.3em;}
.dbtn .go{font-size:1.8em; color:var(--main);}

/* ---------- 問題 ---------- */
.qhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
.qhead .title{font-size:1.3em; font-weight:bold; color:var(--dmain);}
.homebtn{border:1.5px solid var(--lgray); background:#fff; border-radius:12px; padding:10px 18px; font-size:1em; color:#444;}
.dots{text-align:center; margin:10px 0 20px; font-size:1.05em; letter-spacing:7px; color:#d5e3da;}
.dots .on{color:var(--main);}
.instr{background:var(--lmain); color:var(--dmain); border-radius:12px; padding:14px 18px;
  font-size:1.15em; margin-bottom:24px; text-align:center;}
.card{position:relative; background:#fff; border:1.5px solid #dcebe1; border-radius:20px;
  padding:56px 28px 48px; text-align:center; overflow:hidden;}
.sentence{font-size:2.4em; line-height:2.1; margin-bottom:44px;}
/* 文字と同じベースラインに乗る空欄枠(高さ固定をやめ、行ボックスに沿わせる) */
.blank{display:inline-block; min-width:2.2em; padding:0 0.15em; margin:0 0.15em;
  border:2.5px solid var(--main); border-radius:10px; background:#fff;
  text-align:center; line-height:1.35; color:var(--dmain); font-weight:bold;
  white-space:nowrap;}
.blank.filled{background:var(--lok); border-color:var(--ok); color:var(--ok);}
.sp{display:inline-block; width:0.5em;}
.choices{display:flex; flex-wrap:wrap; gap:22px; justify-content:center;}
.ch{min-width:130px; padding:24px 30px; font-size:2em; border-radius:16px;
  border:2px solid var(--lgray); background:#fff;}
.ch:disabled{opacity:0.95;}
/* 状態変化で太字にしない(ボタン幅が変わって行がずれるのを防ぐ) */
.ch.correct{border-color:var(--ok); background:var(--lok); color:var(--ok);}
.ch.second{border-color:var(--tri); background:var(--ltri); color:var(--tri);}
.ch.wrong{border-color:var(--ng); background:var(--lng); color:var(--ng);}
.fb{min-height:1.8em; margin-top:30px; font-size:1.5em; font-weight:bold;}
.nextwrap{min-height:80px; margin-top:14px;}
.nextbtn{background:var(--main); color:#fff; border:2px solid var(--main);
  border-radius:16px; font-size:1.4em; padding:16px 44px;}
.nextbtn rt{color:#ffffff; opacity:0.9;}
.fb.ok{color:var(--ok);}
.fb.tri{color:var(--tri);}
.fb.ng{color:var(--ng);}
.bigmark{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  pointer-events:none; font-weight:bold; opacity:0;}
.bigmark.show{animation:pop 1.2s ease forwards;}
.bigmark .sym{font-size:11em; line-height:1;}
.bigmark.ok .sym{color:rgba(46,139,87,0.55);}
.bigmark.tri .sym{color:rgba(217,144,0,0.55);}
.bigmark.ng .sym{color:rgba(192,80,77,0.5);}
@keyframes pop{
  0%{opacity:0; transform:scale(0.5);}
  25%{opacity:1; transform:scale(1.05);}
  55%{opacity:1; transform:scale(1);}
  100%{opacity:0; transform:scale(1);}
}

/* ---------- 結果 ---------- */
.result{background:#fff; border:1.5px solid #dcebe1; border-radius:20px; padding:60px 24px; text-align:center;}
.result h2{font-size:2.2em; color:var(--dmain); margin:0 0 26px;}
.score{font-size:1.7em; margin-bottom:14px;}
.score b{font-size:1.8em; color:var(--main);}
.marks{font-size:1.8em; letter-spacing:8px; margin-bottom:16px;}
.marks .o{color:var(--ok);} .marks .t{color:var(--tri);} .marks .x{color:var(--ng);}
.legend{font-size:0.95em; color:var(--gray); margin-bottom:30px;}
.bigbtns{display:flex; flex-direction:column; gap:16px; max-width:400px; margin:0 auto;}
.bigbtns button{font-size:1.35em; padding:22px; border-radius:16px; border:2px solid var(--lgray); background:#fff;}
.bigbtns .primary{background:var(--main); border-color:var(--main); color:#fff;}
.bigbtns .primary rt{color:#ffffff; opacity:0.9;}   /* 濃い緑背景ではルビも白 */
.praise{font-size:1.25em; color:var(--gray); margin-bottom:34px;}

/* ---------- スマホ対応 (600px以下) ---------- */
@media(max-width:600px){
  #app{padding:12px 10px 40px;}
  .banner{padding:26px 10px 20px; border-radius:14px;}
  .banner .org{font-size:0.82em; letter-spacing:0;}
  .banner h1{font-size:1.45em;}
  .banner p{font-size:0.92em; margin-top:10px;}
  .banner .titlerow{gap:10px;}
  .banner .logo{width:46px;}
  .leaf{transform:scale(0.7);}
  .dbtn{padding:18px 16px; gap:14px; border-radius:16px;}
  .dbtn .name{font-size:1.4em; min-width:3.6em;}
  .dbtn .stars{font-size:1em;}
  .dbtn .best{font-size:0.9em;}
  .dbtn .go{font-size:1.4em;}
  .qhead .title{font-size:1.05em;}
  .homebtn{padding:8px 14px; font-size:0.95em;}
  .dots{font-size:0.8em; letter-spacing:5px; margin:8px 0 14px;}
  .instr{font-size:1em; padding:11px 12px; margin-bottom:16px;}
  .card{padding:30px 12px 26px; border-radius:16px;}
  .sentence{font-size:1.65em; line-height:2.05; margin-bottom:28px;}
  .choices{gap:12px;}
  .ch{min-width:82px; padding:16px 16px; font-size:1.45em; border-radius:13px;}
  .fb{font-size:1.15em; margin-top:20px; min-height:1.8em;}
  .nextwrap{min-height:64px; margin-top:10px;}
  .nextbtn{font-size:1.15em; padding:14px 32px;}
  .bigmark .sym{font-size:7em;}
  .result{padding:36px 14px;}
  .result h2{font-size:1.6em;}
  .score{font-size:1.3em;}
  .marks{font-size:1.25em; letter-spacing:4px;}
  .legend{font-size:0.85em;}
  .praise{font-size:1.05em;}
  .bigbtns button{font-size:1.15em; padding:17px;}
}
</style>
</head>

const RUBY = /([一-鿿㐀-䶿々〆]+)\[([ぁ-ゖー]+)\]/g;
function toHTML(markup){
  return markup
    .replace(RUBY, "<ruby>$1<rt>$2</rt></ruby>")
    .replace(/ /g, '<span class="sp"></span>')
    .replace(/＠/g, '<span class="blank" id="blank">&#8203;</span>');
}
function toPlain(markup, ans){
  return markup.replace(RUBY, "$1").replace(/＠/g, ans).replace(/ /g, "");
}
function fmt(n){ return Number.isInteger(n) ? String(n) : n.toFixed(1); }
function shuffled(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

window.renderHome = renderHome;

window.startDiff = function(di){
  const items = shuffled(DIFFS[di].pool).slice(0, 10);
  cur = { di: di, items: items, qIdx: 0, tries: 0, results: [] };
  renderQuiz();
};

function curQ(){ return cur.items[cur.qIdx]; }
function maxTries(q){ return (1 + q.d.length) === 2 ? 1 : 2; }

function renderQuiz(){
  const df = DIFFS[cur.di];
  const q = curQ();
  if(!q.order) q.order = shuffled([q.a].concat(q.d));   // 選択肢順は問題ごとに固定
  let dots = "";
  for(let i = 0; i < 10; i++) dots += `<span class="${i <= cur.qIdx ? "on" : ""}">●</span>`;
  app.innerHTML = `
  <div class="qhead">
    <span class="title"><ruby>${df.name}<rt>${df.kana}</rt></ruby>　（${cur.qIdx + 1} / 10）</span>
    <span>${soundBtnHTML()}
    <button class="homebtn" onclick="renderHome()">ホーム</button></span>
  </div>
  <div class="dots">${dots}</div>
  <div class="instr"><ruby>正<rt>ただ</rt></ruby>しい <ruby>言葉<rt>ことば</rt></ruby>を 1つ <ruby>選<rt>えら</rt></ruby>んで ください。</div>
  <div class="card">
    <div class="sentence">${toHTML(q.s)}</div>
    <div class="choices">
      ${q.order.map(ch => `<button class="ch" onclick="answer(this,'${ch}')">${ch}</button>`).join("")}
    </div>
    <div class="fb" id="fb"></div>
    <div class="nextwrap" id="nextwrap"></div>
    <div class="bigmark" id="bigmark"><span class="sym"></span></div>
  </div>`;
  window.scrollTo(0, 0);
}

function showMark(kind){   // "ok" | "tri" | "ng"
  const bm = document.getElementById("bigmark");
  bm.className = "bigmark " + kind;
  bm.querySelector(".sym").textContent = kind === "ok" ? "○" : kind === "tri" ? "△" : "✕";
  void bm.offsetWidth;
  bm.classList.add("show");
}

function lockAndFill(q, second){
  document.querySelectorAll(".ch").forEach(b => {
    b.disabled = true;
    if(b.textContent === q.a && !b.classList.contains("wrong")){
      b.classList.add(second ? "second" : "correct");
    }
  });
  const blank = document.getElementById("blank");
  if(blank){ blank.textContent = q.a; blank.classList.add("filled"); }
}

function showNextBtn(){
  const label = cur.qIdx >= 9
    ? '<ruby>結果<rt>けっか</rt></ruby>をみる'
    : '<ruby>次<rt>つぎ</rt></ruby>の<ruby>問題<rt>もんだい</rt></ruby>';
  document.getElementById("nextwrap").innerHTML =
    `<button class="nextbtn" onclick="next()">${label}</button>`;
}
window.next = next;

window.answer = function(btn, ch){
  const q = curQ();
  const fb = document.getElementById("fb");
  cur.tries++;
  if(ch === q.a){
    const second = cur.tries > 1;
    lockAndFill(q, second);
    if(second){
      fb.className = "fb tri";
      fb.textContent = "△ せいかい！（2回目）";
      showMark("tri"); soundTri();
      cur.results.push(0.5);
    }else{
      fb.className = "fb ok";
      fb.textContent = "○ せいかい！";
      showMark("ok"); soundOK();
      cur.results.push(1);
    }
    speak(toPlain(q.s, q.a));
    showNextBtn();
  }else{
    btn.classList.add("wrong");
    btn.disabled = true;
    if(cur.tries >= maxTries(q)){
      lockAndFill(q, false);
      fb.className = "fb ng";
      fb.innerHTML = `✕　こたえは 「${q.a}」 です`;
      showMark("ng"); soundNG();
      cur.results.push(0);
      speak(toPlain(q.s, q.a));
      showNextBtn();
    }else{
      fb.className = "fb ng";
      fb.innerHTML = "もう<ruby>一度<rt>いちど</rt></ruby> どうぞ";
      showMark("ng"); soundNG();
    }
  }
};

function next(){
  cur.qIdx++;
  cur.tries = 0;
  if(cur.qIdx >= 10){ finish(); }
  else{ renderQuiz(); }
}

function finish(){
  const score = cur.results.reduce((a, b) => a + b, 0);
  const di = cur.di;
  const rec = store["d" + di] || {};
  rec.best = Math.max(rec.best || 0, score);
  rec.last = score;
  store["d" + di] = rec;
  saveStore(store);
  cur.items.forEach(q => delete q.order);
  const praise = score === 10 ? "たいへん よくできました！"
              : score >= 7 ? "よく がんばりました！"
              : "ゆっくりで だいじょうぶです。";
  const marks = cur.results.map(r =>
    r === 1 ? '<span class="o">○</span>' :
    r === 0.5 ? '<span class="t">△</span>' :
    '<span class="x">✕</span>').join("");
  const btns = `
    <button class="primary" onclick="startDiff(${di})">もう<ruby>一度<rt>いちど</rt></ruby> やる（べつの10<ruby>問<rt>もん</rt></ruby>）</button>
    <button onclick="renderHome()">ホームへ もどる</button>`;
  app.innerHTML = `
  <div class="result">
    <h2>おわりました</h2>
    <div class="score">10点満点中<b> ${fmt(score)} </b>点</div>
    <div class="marks">${marks}</div>
    <div class="legend">○ = 1点　△ = 0.5点（2回目で正解）　✕ = 0点</div>
    <div class="praise">${praise}</div>
    <div class="bigbtns">${btns}</div>
  </div>`;
  if(score === 10) beep([523, 659, 784, 1047], 0.16, "sine", 0.22);
  cur = null;
  window.scrollTo(0, 0);
}

renderHome();
</script>
</body>
</html>
